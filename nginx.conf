server {
  listen 80;
  server_name admin.diettime.com _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { access_log off; add_header Content-Type text/plain; try_files $uri =404; }
  location ^~ /api/ {
    # Keep the API's configured upload limits authoritative.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass __DIET_TIME_API_ORIGIN__;
    proxy_set_header Host __DIET_TIME_API_HOST__;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name __DIET_TIME_API_HOSTNAME__;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_redirect off;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.diettime.com https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
